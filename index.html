<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>M50B25 Explorer · E34 525i</title>
<style>
:root{--bg:#0a0e12;--panel:#151a20;--line:#303840;--text:#edf2f5;--muted:#99a5ae;--blue:#76bfdc;--metal:#68727a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{min-height:100svh}button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
header{padding:calc(13px + env(safe-area-inset-top)) 16px 13px;background:#10151a;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.top{background:#222a31;border:1px solid #3b464e;border-radius:9px;padding:9px 12px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 375px;min-height:calc(100svh - 72px)}
.viewer{position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:72px 16px 32px;background:radial-gradient(circle at 50% 45%,#303940 0,#171d23 48%,#080b0e 100%)}
.toolbar{position:absolute;top:12px;left:12px;right:12px;z-index:80;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.toolbar button{background:#20272e;border:1px solid #3c474f;border-radius:8px;padding:8px 10px;font-size:12px}
.toolbar button.active{background:#294b5a;border-color:#78bdd7}.step{margin-left:auto;color:#aeb8c0;font-size:12px}
.scene{position:relative;width:min(1000px,98%);aspect-ratio:1.42;filter:drop-shadow(0 24px 25px #000b)}
.bay{position:absolute;inset:0;border-radius:28px;background:linear-gradient(135deg,#20272b,#11161a);border:2px solid #465057;box-shadow:inset 0 0 0 9px #0a0d10}
.strut{position:absolute;width:19%;height:17%;border-radius:50%;background:radial-gradient(circle,#232a2f 0 28%,#8c959b 29% 32%,#31383d 33% 63%,#0e1215 64%);border:2px solid #4f595f;opacity:.9}
.strut.l{left:3%;top:7%}.strut.r{right:3%;top:7%}
.firewall{position:absolute;left:22%;right:22%;top:2%;height:18%;background:linear-gradient(#2c3338,#161b1f);border-bottom:2px solid #596269;border-radius:8px}
.engineBody{position:absolute;left:26%;top:12%;width:49%;height:78%;transform:perspective(900px) rotateX(10deg) rotateZ(-1deg)}
.layer{position:absolute;cursor:pointer;transition:.35s ease;outline:none}.layer:hover,.layer:focus{filter:brightness(1.17);z-index:90}
.layer.removed{opacity:0;pointer-events:none;transform:translateY(-75px) scale(.94)!important}
.layer.locked{opacity:.14;pointer-events:none;filter:grayscale(.8)}
.layer.unlocked{filter:drop-shadow(0 0 9px #78bdd766)}
/* E34/M50-specific outer components */
.valve{left:15%;top:2%;width:70%;height:17%;border-radius:8px;background:linear-gradient(90deg,#252c31,#4b555c 22%,#20262b 48%,#4d565d 78%,#232a2f);border:3px solid #69747b;box-shadow:inset 0 0 0 2px #14191d}
.valve:after{content:"";position:absolute;left:7%;right:7%;top:38%;height:12%;background:repeating-linear-gradient(90deg,#879096 0 3px,transparent 3px 13px);opacity:.55}
.oilcap{position:absolute;right:5%;top:22%;width:13%;height:26%;border-radius:50%;background:#252c30;border:3px solid #737e85}
.oilcap:after{content:"OIL";position:absolute;inset:30% 20%;font-size:8px;color:#9ba6ac;display:grid;place-items:center}
.coils{left:22%;top:17%;width:56%;height:11%;display:flex;gap:2%;padding:3px}
.coil{flex:1;border-radius:4px;background:linear-gradient(#20262b,#080b0e);border:2px solid #5c666d}
.head{left:12%;top:26%;width:76%;height:14%;border-radius:7px;background:linear-gradient(#9ba3a8,#5e686f);border:3px solid #c0c6c9;box-shadow:inset 0 -6px #40484e}
.intake{left:7%;top:39%;width:61%;height:30%;border-radius:18px 13px 13px 18px;background:linear-gradient(145deg,#20272c,#0d1216);border:3px solid #48535a;box-shadow:inset 0 0 0 3px #30383d}
.runners{position:absolute;left:10%;right:6%;top:18%;height:58%;display:flex;gap:3%;align-items:center}
.runner{flex:1;height:90%;border-radius:48% 48% 18% 18%;background:linear-gradient(90deg,#4a555b,#161c20 42%,#39434a);border:2px solid #606b72;box-shadow:inset -5px 0 #11161a}
.throttle{left:-2%;top:50%;width:13%;height:18%;border-radius:50%;background:#aab0b3;border:4px solid #555f65;z-index:5}
.intakePipe{left:-16%;top:61%;width:28%;height:9%;border-radius:30px;background:#262d32;border:3px solid #4d575d;transform:rotate(10deg)}
.airbox{left:-30%;top:58%;width:25%;height:25%;border-radius:6px;background:linear-gradient(#252d32,#11161a);border:3px solid #4e5960}
.airbox:after{content:"";position:absolute;inset:8px;border:1px solid #69747a;border-radius:3px}
.exhaust{left:8%;top:69%;width:47%;height:20%;display:flex;gap:2%;padding:4px;transform:rotate(-2deg)}
.headerPipe{flex:1;border-radius:50%;background:linear-gradient(90deg,#3e464a,#171b1e,#596166);border:2px solid #697279}
.block{left:17%;top:66%;width:67%;height:26%;border-radius:10px;background:linear-gradient(145deg,#70797f,#343b40);border:3px solid #8e989e;box-shadow:inset 0 0 0 7px #292f34}
.oilpan{left:20%;top:88%;width:60%;height:12%;border-radius:8px 8px 22px 22px;background:linear-gradient(#4b545a,#171b1f);border:3px solid #68737a}
.waterpump{right:-7%;top:72%;width:15%;height:16%;border-radius:50%;background:radial-gradient(circle,#69747a 0 25%,#20272c 27% 55%,#7a858b 56% 60%,#242b30 61%);border:3px solid #879197}
.belt{right:-10%;top:45%;width:9%;height:38%;border:7px solid #14191c;border-radius:50%;transform:rotate(-8deg)}
.dipstick{right:12%;top:45%;width:3%;height:23%;background:#c84f2e;border-radius:4px;transform:rotate(-7deg);z-index:6}
.battery{position:absolute;right:4%;bottom:7%;width:18%;height:18%;background:#151a1e;border:3px solid #465057;border-radius:6px}
.battery:after{content:"+";position:absolute;right:10%;top:8%;color:#d75b46;font-weight:bold}
.motion{position:absolute;inset:0;pointer-events:none;z-index:50}.motion.hidden{display:none}
.motion .p{position:absolute;width:5%;height:7%;border-radius:45% 45% 15% 15%;background:linear-gradient(90deg,#d0d5d7,#646e75);border:2px solid #eef0f1;transform:translate(-50%,-50%);pointer-events:auto}
.motion .r{position:absolute;width:1.7%;background:#89939a;border:2px solid #c6cbce;border-radius:50%;transform-origin:50% 4%;pointer-events:auto}
.motion .cw{position:absolute;left:50%;top:82%;width:54%;height:10%;border:7px solid #c6cbce;border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto}
.motion .hub{position:absolute;left:50%;top:82%;width:4%;height:4%;border-radius:50%;background:#e0e3e5;border:2px solid #68737a;transform:translate(-50%,-50%);pointer-events:auto}
.hint{position:absolute;bottom:10px;left:14px;color:#7f8b94;font-size:10px}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow:auto}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#263039;border:1px solid #3a4851;color:#b8dcea;font-size:11px;margin-bottom:10px}
.panel h2{margin:0 0 8px;font-size:24px}.panel p{color:#c8d0d6;line-height:1.56}.panel h3{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#89959e}.panel ul{margin:0;padding-left:20px;color:#c7cfd5;line-height:1.65}
.fact{background:#10151a;border:1px solid #303b43;border-radius:9px;padding:11px 12px;font-size:12px;color:#c8d1d7;margin-top:13px}
.next{width:100%;padding:12px;margin-top:14px;background:#285365;border:1px solid #70b9d5;border-radius:9px}
@media(max-width:850px){.app{display:block}.viewer{min-height:59svh}.panel{border-left:0;border-top:1px solid var(--line);min-height:41svh}.step{width:100%;margin-left:0}.scene{width:100%}}
@media(max-width:600px){.viewer{padding:82px 5px 24px}.toolbar button{padding:8px 9px}.panel{padding:18px}.panel h2{font-size:22px}}

.engineSVG{width:100%;height:100%;display:block;filter:drop-shadow(0 22px 24px #0009)}
.svgPart{cursor:pointer;transition:filter .22s,opacity .35s,transform .35s;transform-box:fill-box;transform-origin:center}
.svgPart:hover{filter:brightness(1.18) drop-shadow(0 0 7px #8acbe266)}
.svgPart.removed{opacity:0;pointer-events:none;transform:translateY(-80px) scale(.95)}
.svgPart.locked{opacity:.12;pointer-events:none;filter:grayscale(1)}
.svgPart.unlocked{filter:drop-shadow(0 0 8px #78bdd755)}
</style>
</head>

<script>
const parts={
valve:{title:"Ventildeckel",tag:"M50B25 · oben",text:"Der charakteristische M50-Ventildeckel sitzt längs über dem Zylinderkopf. Darunter befinden sich die beiden obenliegenden Nockenwellen und der Ventiltrieb.",why:"Beim Zerlegen wird er zuerst abgenommen, damit der Ventiltrieb sichtbar wird.",links:["Zündspulen","Nockenwellen","Zylinderkopf","Dichtfläche"]},
oilcap:{title:"Öleinfülldeckel",tag:"Schmierung",text:"Über den Öleinfülldeckel wird Motoröl in den Motor eingefüllt. Er sitzt auf dem Ventildeckel.",why:"Das Öl gelangt in den Schmierkreislauf und versorgt Lager, Nockenwellen und weitere Reibstellen.",links:["Motoröl","Ventildeckel","Ölwanne"]},
coils:{title:"6 Zündspulen",tag:"Zündung",text:"Der M50 verwendet eine Einzelzündspule pro Zylinder. Die Spulen sitzen oben am Zylinderkopf unter dem Ventildeckelbereich.",why:"Jeder Zylinder benötigt zum richtigen Zeitpunkt einen Zündfunken.",links:["Zündkerzen","Motorsteuergerät","Kurbelwellensignal"]},
head:{title:"Zylinderkopf",tag:"24 Ventile · DOHC",text:"Der M50B25 ist ein Reihensechszylinder mit 24 Ventilen und zwei obenliegenden Nockenwellen. Der Zylinderkopf bildet die Brennräume und führt den Gaswechsel.",why:"Ein- und Auslassventile bestimmen, wann Frischgas einströmt und Abgas austritt.",links:["Einlassseite","Auslassseite","Nockenwellen","Ventile"]},
intake:{title:"Ansaugkrümmer",tag:"6 Ansaugkanäle",text:"Der schwarze Ansaugkrümmer des E34-M50B25 besitzt sechs einzelne Läufe zu den Zylindern. Seine Form beeinflusst die Strömung und damit das Drehmomentverhalten.",why:"Jeder Zylinder braucht einen definierten Weg für die Frischluft.",links:["Drosselklappe","Luftmengenmesser","Luftfilterkasten","Einspritzventile"]},
throttle:{title:"Drosselklappe",tag:"Laststeuerung",text:"Die Drosselklappe sitzt am Eingang des Ansaugtrakts und steuert die vom Motor angesaugte Luftmenge.",why:"Beim Ottomotor wird die Last im klassischen System wesentlich über die Drosselung der Ansaugluft bestimmt.",links:["Ansaugschlauch","Leerlaufregelung","Ansaugkrümmer"]},
intakePipe:{title:"Ansaugschlauch",tag:"Luftführung",text:"Der geformte Ansaugschlauch verbindet die Luftführung mit der Drosselklappe.",why:"Er muss die benötigte Luft möglichst verlustarm und dicht zur Drosselklappe führen.",links:["Luftfilterkasten","Drosselklappe","Luftmengenmesser"]},
airbox:{title:"Luftfilterkasten",tag:"Ansaugluft",text:"Der E34 besitzt einen separaten Luftfilterkasten im Motorraum. Er filtert die angesaugte Luft, bevor sie zum Motor gelangt.",why:"Staub und Partikel würden Zylinderlaufbahnen und andere Bauteile stark verschleißen lassen.",links:["Luftfilter","Luftmengenmesser","Ansaugschlauch"]},
exhaust:{title:"Abgaskrümmer",tag:"6 Zylinder",text:"Auf der gegenüberliegenden Seite des Zylinderkopfs führen Abgaskanäle die Verbrennungsgase aus den sechs Zylindern zusammen. Der E34-M50 hat getrennte vordere und hintere Abgaskrümmer-Baugruppen.",why:"Der Abgasstrom muss aus den Zylindern abgeführt werden, bevor der nächste Ansaugtakt beginnt.",links:["Auslassventile","Katalysator","Abgasanlage"]},
block:{title:"Zylinderblock",tag:"Reihensechszylinder",text:"Der M50B25 hat sechs in Reihe angeordnete Zylinder. Der Block nimmt Zylinderlaufbahnen, Kurbelwelle und Hauptlager auf.",why:"Er ist das tragende Zentrum des Grundmotors und muss hohe Verbrennungs- und Lagerkräfte aufnehmen.",links:["Kolben","Pleuel","Kurbelwelle","Hauptlager"]},
oilpan:{title:"Ölwanne",tag:"Schmierkreislauf",text:"Die Ölwanne bildet den unteren Ölvorrat des Motors. Die Ölpumpe saugt von dort Öl an und verteilt es im Schmierkreislauf.",why:"Ohne stabile Ölversorgung würden Lager und andere hoch belastete Gleitflächen sehr schnell Schaden nehmen.",links:["Ölpumpe","Ölsieb","Kurbelwelle","Ölfilter"]},
waterpump:{title:"Wasserpumpe",tag:"Kühlung",text:"Die Wasserpumpe zirkuliert das Kühlmittel durch den Motor und weiter zum Kühler.",why:"Der M50 muss die bei der Verbrennung entstehende Wärme kontrolliert abführen.",links:["Thermostat","Kühler","Kühlmittelkanäle"]},
belt:{title:"Nebenaggregateriemen",tag:"Antrieb",text:"Der Riemen treibt Nebenaggregate des Motors an. Die genaue Ausstattung kann je nach Baujahr und Fahrzeugausführung variieren.",why:"Die Kurbelwelle liefert über den Riemenantrieb mechanische Leistung an die Nebenaggregate.",links:["Kurbelwellenriemenscheibe","Wasserpumpe","Generator"]},
dipstick:{title:"Ölmessstab",tag:"Kontrolle",text:"Mit dem Ölmessstab wird der Motorölstand kontrolliert.",why:"Der Ölstand muss innerhalb des vorgesehenen Bereichs liegen, damit die Ölpumpe zuverlässig versorgt wird.",links:["Ölwanne","Motoröl","Ölpumpe"]},
piston:{title:"Kolben",tag:"Kurbeltrieb",text:"Sechs Kolben bewegen sich in den sechs Zylindern. Sie nehmen den Verbrennungsdruck auf und übertragen ihn über die Pleuel auf die Kurbelwelle.",why:"Die Kolbenbewegung ist die direkte Folge des Verbrennungsdrucks und der Kurbelwellenbewegung.",links:["Kolbenringe","Pleuel","Zylinderlaufbahn"]},
rod:{title:"Pleuel",tag:"Kraftübertragung",text:"Jedes Pleuel verbindet einen Kolben mit einem Kurbelzapfen. Es überträgt Zug- und Druckkräfte zwischen Kolben und Kurbelwelle.",why:"Das Pleuel ermöglicht die Umwandlung der linearen Kolbenbewegung in die Drehbewegung der Kurbelwelle.",links:["Kolbenbolzen","Pleuellager","Kurbelzapfen"]},
crank:{title:"Kurbelwelle",tag:"Kraftumwandlung",text:"Die Kurbelwelle wandelt die Hubbewegung der sechs Kolben in Drehbewegung um. Sie ist im Block über Hauptlager gelagert.",why:"Die Drehbewegung der Kurbelwelle ist die mechanische Leistung, die über Schwungrad und Kupplung zum Getriebe gelangt.",links:["Hauptlager","Pleuellager","Schwungrad","Ölpumpe"]},
overview:{title:"M50B25 im E34",tag:"Originalgetreue Lernansicht",text:"Diese Version orientiert sich am Motorraum des BMW E34 525i und am charakteristischen M50B25-Aufbau: längs eingebauter Reihensechszylinder, schwarzer Ansaugkrümmer mit sechs Läufen, Einzelzündspulen, Ventildeckel, Luftfilterkasten und Nebenaggregate.",why:"Für das Lernen ist die Lage entscheidend. Deshalb bleiben die Bauteile bewusst in ihrer typischen Einbaulage, bevor wir sie in der Zerlegung auseinanderziehen.",links:["Ventildeckel","Zylinderkopf","Ansaugkrümmer","Abgaskrümmer","Zylinderblock","Kurbeltrieb"]}
};
const steps=[
{name:"1 · Ventildeckel",remove:["valve"],unlock:["valve","oilcap","coils","head","intake","throttle","intakePipe","airbox","exhaust","block","oilpan","waterpump","belt","dipstick"],msg:"Ventildeckel und Öleinfülldeckel bilden die oberste Abdeckung. Entferne sie, um den Ventiltrieb zu untersuchen."},
{name:"2 · Zündung & Kopf",remove:["coils","head"],unlock:["intake","throttle","intakePipe","airbox","exhaust","block","oilpan","waterpump","belt","dipstick"],msg:"Die Zündspulen sind entfernt; anschließend kann der Zylinderkopf als Baugruppe untersucht werden."},
{name:"3 · Gaswechsel",remove:["intake","exhaust"],unlock:["block","oilpan","waterpump","belt","dipstick"],msg:"Ansaug- und Abgasseite sind weg. Der Grundmotor wird sichtbar."},
{name:"4 · Grundmotor",remove:["block"],unlock:["piston","rod","crank","oilpan"],msg:"Der Zylinderblock ist als Hülle ausgeblendet. Jetzt lernen wir den Kurbeltrieb als einzelne Komponenten."},
{name:"5 · Kurbeltrieb",remove:[],unlock:["piston","rod","crank","oilpan"],msg:"Kolben, Pleuel und Kurbelwelle sind jetzt einzelne bewegliche Lernobjekte."}
];
let active=false,stepIndex=0,motionOn=true,angle=0,last=0;
function render(d,extra=""){
document.getElementById("panel").innerHTML=`<span class="badge">${d.tag}</span><h2>${d.title}</h2><p>${d.text}</p><h3>Warum?</h3><p>${d.why}</p><h3>Zusammenhang</h3><ul>${d.links.map(x=>`<li>${x}</li>`).join("")}</ul>${extra}`;
}
function update(){
document.getElementById("step").textContent=active?steps[stepIndex].name:"Außenansicht";
document.getElementById("modeBtn").textContent=active?"🔧 Zerlegung aktiv":"🔧 Zerlegung starten";
document.querySelectorAll(".svgPart").forEach(e=>{e.classList.remove("removed","locked","unlocked");if(active){let s=steps[stepIndex];if(s.remove.includes(e.dataset.id))e.classList.add("removed");else if(s.unlock.includes(e.dataset.id))e.classList.add("unlocked");else e.classList.add("locked")}});
if(active)render({title:steps[stepIndex].name,tag:"Zerlegungsmodus",text:steps[stepIndex].msg,why:"Tippe auf freigegebene Komponenten. Mit „Weiter“ gehst du zur nächsten Zerlegungsstufe.",links:["Einbaulage","Funktion","mechanischer Zusammenhang"]});
}
function toggleMode(){active=!active;stepIndex=0;update();if(!active)render(parts.overview)}
function nextStep(){if(!active)active=true;else if(stepIndex<steps.length-1)stepIndex++;update()}
function prevStep(){if(active&&stepIndex>0)stepIndex--;update()}
function resetAll(){active=false;stepIndex=0;update();render(parts.overview)}
document.querySelectorAll(".svgPart").forEach(e=>{let f=()=>render(parts[e.dataset.id]||parts.overview);e.addEventListener("click",f);e.addEventListener("keydown",x=>{if(x.key==="Enter"||x.key===" "){x.preventDefault();f()}})});

const motion=document.getElementById("motion"),ps=[...motion.querySelectorAll(".p")],rs=[...motion.querySelectorAll(".r")],cw=document.getElementById("cw");
function layout(){let cx=50,cy=82, x0=32,gap=7.2,amp=9;ps.forEach((p,i)=>{let x=x0+i*gap,ph=[0,Math.PI,0,Math.PI,0,Math.PI][i],a=angle+ph,y=57+Math.cos(a)*amp;p.style.left=x+"%";p.style.top=y+"%";let dx=cx-x,dy=cy-y,len=Math.hypot(dx,dy),r=rs[i];r.style.left=x+"%";r.style.top=y+"%";r.style.height=len+"%";r.style.transform=`translate(-50%,0) rotate(${Math.atan2(dy,dx)*180/Math.PI+90}deg)`});cw.style.transform=`translate(-50%,-50%) rotate(${angle*180/Math.PI}deg)`}
function loop(t){if(!last)last=t;let dt=Math.min(50,t-last);last=t;if(motionOn){angle+=dt*.0022;layout()}requestAnimationFrame(loop)}layout();requestAnimationFrame(loop);
function showMotion(){motion.classList.remove("hidden");render({...parts.crank},`<div class="fact"><b>Bewegungsmodell</b><br>Die Kolben bewegen sich auf und ab, die Pleuel übertragen die Kräfte und die Kurbelwelle dreht sich.</div><button class="next" onclick="motionOn=!motionOn">${motionOn?"⏸ Animation pausieren":"▶︎ Animation starten"}</button>`)}
ps.forEach((p,i)=>p.addEventListener("click",e=>{e.stopPropagation();showMotion();render({...parts.piston,title:`Kolben ${i+1}`},`<div class="fact"><b>Zylinder ${i+1}</b><br>Ein einzelner Kolben bewegt sich innerhalb seiner Zylinderlaufbahn.</div>`)}));
rs.forEach((r,i)=>r.addEventListener("click",e=>{e.stopPropagation();showMotion();render({...parts.rod,title:`Pleuel ${i+1}`},`<div class="fact"><b>Zylinder ${i+1}</b><br>Das Pleuel verbindet den jeweiligen Kolben mit der Kurbelwelle.</div>`)}));
cw.addEventListener("click",e=>{e.stopPropagation();showMotion()});
document.getElementById("hub").addEventListener("click",e=>{e.stopPropagation();showMotion()});
render(parts.overview);
</script>
</body>
</html>
