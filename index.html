<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M50B25 Explorer">
<title>M50B25 Explorer – Zerlegung</title>
<style>
:root{--bg:#0d1117;--panel:#151b23;--line:#303944;--text:#eef3f8;--muted:#9ba7b4;--accent:#79c7e8;--accent2:#e7b76a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{min-height:100svh}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:#11161d;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.topbtn{background:#222b35;border:1px solid #3b4652;border-radius:9px;padding:9px 12px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:calc(100svh - 76px)}
.viewer{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:70px 22px 28px;background:radial-gradient(circle at 50% 45%,#28333f 0,#151b22 45%,#0a0d11 100%)}
.toolbar{position:absolute;z-index:50;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar button{background:#202933;border:1px solid #3b4652;border-radius:9px;padding:9px 11px;font-size:13px}
.toolbar button.active{background:#294b5a;border-color:#70b7d4}
.step{margin-left:auto;color:var(--muted);font-size:12px}
.canvas{width:min(900px,96%);aspect-ratio:1.45;position:relative;filter:drop-shadow(0 25px 28px #0009)}
.engine{position:absolute;inset:0}
.layer{position:absolute;left:50%;transform:translateX(-50%);transition:.35s ease;cursor:pointer;outline:none}
.layer:hover,.layer:focus{filter:brightness(1.18);transform:translateX(-50%) scale(1.018)}
.layer.removed{opacity:0;pointer-events:none;transform:translate(-50%,-80px) scale(.92)}
.layer.locked{opacity:.18;pointer-events:none;filter:grayscale(.8)}
.layer.unlocked{filter:drop-shadow(0 0 8px #79c7e855)}
/* Exploded engine drawing */
.valvecover{top:2%;width:45%;height:11%;border-radius:12px;background:linear-gradient(145deg,#313941,#171c22);border:3px solid #66727e}
.coils{top:14%;width:43%;height:7%;border-radius:8px;background:#232a31;border:2px solid #606c77}
.head{top:21%;width:54%;height:18%;border-radius:11px;background:linear-gradient(145deg,#aab3bb,#59636c);border:3px solid #d0d6da;box-shadow:inset 0 0 0 5px #717c85}
.cams{top:25%;width:42%;height:7%;border-radius:8px;background:#343c44;border:3px solid #89949d}
.block{top:40%;width:58%;height:32%;border-radius:12px;background:linear-gradient(145deg,#727c85,#343b43);border:3px solid #aab2b9;box-shadow:inset 0 0 0 8px #282e34}
.pistons{top:46%;width:43%;height:17%;display:flex;justify-content:space-between;align-items:center}
.piston{width:16%;height:72%;border-radius:40% 40% 14% 14%;background:linear-gradient(90deg,#a8afb4,#545d64);border:3px solid #d0d5d8}
.rods{top:56%;width:38%;height:16%;display:flex;justify-content:space-around;align-items:center}
.rod{width:9%;height:86%;border-radius:40%;background:#777f86;border:2px solid #b4bcc2;transform:rotate(9deg)}
.crank{top:65%;width:51%;height:12%;border-radius:50%;background:#252b30;border:8px solid #c1c7ca}
.oilpan{top:75%;width:56%;height:13%;border-radius:8px 8px 24px 24px;background:linear-gradient(145deg,#3c454d,#171c20);border:3px solid #707b84}
.intake{left:78%;top:36%;transform:none;width:20%;height:18%;border-radius:10px;background:#3d7186;border:3px solid #83b7c9}
.intake:hover,.intake:focus{transform:scale(1.018)}
.exhaust{left:5%;top:44%;transform:none;width:20%;height:19%;border-radius:10px;background:#555d64;border:3px solid #909aa2}
.exhaust:hover,.exhaust:focus{transform:scale(1.018)}
.waterpump{left:15%;top:24%;transform:none;width:10%;height:12%;border-radius:50%;background:#60727b;border:3px solid #a5bac3}
.waterpump:hover,.waterpump:focus{transform:scale(1.018)}
.label{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);font-size:13px;color:#b9c4ce;white-space:nowrap}
.legend{position:absolute;left:14px;bottom:10px;color:#7f8b97;font-size:11px}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow:auto}
.badge{display:inline-block;background:#27313b;border:1px solid #3a4652;border-radius:999px;padding:5px 9px;color:#b9d9e8;font-size:11px;margin-bottom:10px}
.panel h2{margin:0 0 8px;font-size:25px}.panel p{color:#c6ced6;line-height:1.58}.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#87939f;margin:23px 0 8px}
.panel ul{margin:0;padding-left:20px;color:#c7cfd7;line-height:1.65}
.fact{background:#10161d;border:1px solid #2d3741;border-radius:10px;padding:11px 12px;margin-top:14px;color:#cbd4dc;font-size:13px}
.next{width:100%;margin-top:18px;padding:12px;border-radius:9px;background:#274c5b;border:1px solid #6aafca}
.small{font-size:12px;color:var(--muted)}
@media(max-width:850px){
 .app{display:block}.viewer{min-height:58svh}.panel{border-left:0;border-top:1px solid var(--line);min-height:42svh}
 .step{width:100%;margin-left:0}.canvas{width:100%}
}
@media(max-width:600px){
 header{padding-top:calc(12px + env(safe-area-inset-top))}.viewer{padding:82px 6px 25px}.toolbar{top:10px;left:10px;right:10px}.toolbar button{font-size:12px;padding:8px 9px}
 .panel{padding:18px}.panel h2{font-size:22px}.legend{font-size:10px}
}
</style>
</head>
<body>
<header>
<div><h1>M50B25 Explorer</h1><div class="sub">E34 525i · M50B25 · interaktive Zerlegung</div></div>
<button class="topbtn" onclick="resetAll()">↺ Reset</button>
</header>
<div class="app">
<section class="viewer">
<div class="toolbar">
<button id="modeBtn" onclick="toggleMode()">🔧 Zerlegung starten</button>
<button onclick="prevStep()">← Zurück</button>
<button onclick="nextStep()">Weiter →</button>
<div class="step" id="step">Übersicht</div>
</div>

<div class="canvas">
<div class="engine" id="engine">
  <div class="layer valvecover" data-id="valvecover" tabindex="0"></div>
  <div class="layer coils" data-id="coils" tabindex="0"></div>
  <div class="layer head" data-id="head" tabindex="0"></div>
  <div class="layer cams" data-id="cams" tabindex="0"></div>
  <div class="layer block" data-id="block" tabindex="0"></div>
  <div class="layer pistons" data-id="pistons" tabindex="0">
    <span class="piston"></span><span class="piston"></span><span class="piston"></span><span class="piston"></span><span class="piston"></span><span class="piston"></span>
  </div>
  <div class="layer rods" data-id="rods" tabindex="0">
    <span class="rod"></span><span class="rod"></span><span class="rod"></span><span class="rod"></span><span class="rod"></span><span class="rod"></span>
  </div>
  <div class="layer crank" data-id="crank" tabindex="0"></div>
  <div class="layer oilpan" data-id="oilpan" tabindex="0"></div>
  <div class="layer intake" data-id="intake" tabindex="0"></div>
  <div class="layer exhaust" data-id="exhaust" tabindex="0"></div>
  <div class="layer waterpump" data-id="waterpump" tabindex="0"></div>
  <div class="label">Tippe auf ein Bauteil für die Erklärung</div>
</div>
</div>
<div class="legend">Schematische Explosionsansicht – Bauteile sind bewusst vereinfacht dargestellt.</div>
</section>

<aside class="panel" id="panel"></aside>
</div>

<script>
const parts={
overview:{title:"M50B25 – Motor",tag:"Ausgangspunkt",text:"Hier beginnt die Zerlegung. Wir betrachten den Motor als Baugruppen und gehen anschließend bis zu einzelnen Komponenten des Kurbel- und Ventiltriebs.",why:"Die Reihenfolge ist didaktisch wichtig: Erst verstehen wir die Lage und Aufgabe einer Baugruppe, dann nehmen wir sie weg und untersuchen, was darunter liegt.",links:["Ventildeckel","Zylinderkopf","Zylinderblock","Kurbeltrieb","Ölwanne","Ansaugung","Abgasseite","Kühlung"]},
valvecover:{title:"Ventildeckel",tag:"Zerlegung 1",text:"Der Ventildeckel schließt den oberen Bereich des Zylinderkopfs ab und hält das Motoröl im Bereich des Ventiltriebs. Unter ihm liegen die Nockenwellen und der Ventiltrieb.",why:"Erst wenn diese Abdeckung entfernt ist, können wir den Ventiltrieb direkt betrachten.",links:["Nockenwellen","Zylinderkopf","Dichtung","Kurbelgehäuseentlüftung"]},
coils:{title:"Zündspulen",tag:"Zündung",text:"Die Zündspulen erzeugen die für die Zündkerzen benötigte Hochspannung. Beim M50 mit Einzelzündspulen sitzt jeweils eine Spule über einer Zündkerze.",why:"Die Zündung muss im richtigen Moment einen Funken erzeugen, damit das verdichtete Gemisch verbrennen kann.",links:["Zündkerzen","Motorsteuerung","Kurbelwellen-/Nockenwellensignal"]},
head:{title:"Zylinderkopf",tag:"Baugruppe",text:"Der Zylinderkopf enthält die Brennräume sowie den Ventiltrieb. Beim M50B25 arbeiten zwei obenliegende Nockenwellen (DOHC) mit vier Ventilen pro Zylinder.",why:"Hier findet der kontrollierte Gaswechsel statt: Frischgas hinein, Abgas hinaus.",links:["Nockenwellen","Einlassventile","Auslassventile","Zylinderkopfdichtung"]},
cams:{title:"Nockenwellen",tag:"Ventiltrieb",text:"Die Nockenwellen betätigen die Ventile über den Ventiltrieb. Ihre Stellung zur Kurbelwelle bestimmt, wann die Ventile öffnen und schließen.",why:"Die Ventile müssen exakt zum Bewegungsablauf der Kolben arbeiten. Schon kleine Abweichungen der Steuerzeiten können den Motorlauf stark beeinflussen.",links:["Ventile","Hydrostößel","Steuerkette","Kurbelwelle"]},
block:{title:"Zylinderblock",tag:"Grundmotor",text:"Der Zylinderblock bildet das tragende Gehäuse des Grundmotors. In den sechs Zylindern bewegen sich die Kolben; im unteren Bereich sitzt die Kurbelwelle.",why:"Der Block hält die bewegten Bauteile geometrisch präzise und führt Kräfte, Öl und Kühlmittel.",links:["Zylinderlaufbahnen","Kolben","Pleuel","Kurbelwelle","Hauptlager"]},
pistons:{title:"Kolben",tag:"Kurbeltrieb",text:"Der M50B25 besitzt sechs Kolben. Jeder Kolben bewegt sich im Zylinder auf und ab und überträgt die Kraft der Verbrennung über das Pleuel.",why:"Der Kolben nimmt den Verbrennungsdruck auf. Seine lineare Bewegung wird später über das Pleuel in eine Drehbewegung der Kurbelwelle umgewandelt.",links:["Kolbenringe","Pleuel","Zylinderlaufbahn","Kurbelwelle"]},
rods:{title:"Pleuel",tag:"Kraftübertragung",text:"Jedes Pleuel verbindet einen Kolben mit der Kurbelwelle. Es muss hohe wechselnde Zug- und Druckkräfte übertragen.",why:"Ohne das Pleuel gäbe es keine mechanische Verbindung zwischen der auf- und abgehenden Kolbenbewegung und der rotierenden Kurbelwelle.",links:["Kolbenbolzen","Pleuellager","Kurbelzapfen"]},
crank:{title:"Kurbelwelle",tag:"Kraftumwandlung",text:"Die Kurbelwelle nimmt die Kräfte der Pleuel auf und wandelt die Hubbewegung der Kolben in Drehbewegung um. Sie ist über Hauptlager im Motorblock gelagert.",why:"Das Getriebe benötigt eine rotierende Antriebsleistung. Die Kurbelwelle ist die zentrale mechanische Ausgangswelle des Motors.",links:["Hauptlager","Pleuellager","Schwungrad","Ölpumpe"]},
oilpan:{title:"Ölwanne",tag:"Schmierung",text:"Die Ölwanne bildet den unteren Vorratsraum des Motoröls. Von hier wird das Öl über die Ansaugung der Ölpumpe wieder in den Schmierkreislauf gefördert.",why:"Motoröl reduziert Reibung, führt Wärme ab und schützt hoch belastete Lager- und Gleitflächen.",links:["Ölpumpe","Ölsieb","Kurbelwelle","Ölfilter"]},
intake:{title:"Ansaugung",tag:"Gaswechsel",text:"Die Ansaugseite führt die benötigte Luft zum Motor. Zu ihr gehören unter anderem Luftführung, Drosselklappe und Ansaugkrümmer.",why:"Die Luftmenge beeinflusst zusammen mit der Kraftstoffmenge die Leistung und den Verbrennungsablauf.",links:["Luftfilter","Luftmengen-/Luftmassensignal","Drosselklappe","Ansaugkrümmer"]},
exhaust:{title:"Abgasseite",tag:"Gaswechsel",text:"Die Abgasseite sammelt die Verbrennungsgase aus den Zylindern und führt sie zur weiteren Abgasbehandlung.",why:"Die Abgase müssen kontrolliert aus den Zylindern abgeführt werden, damit der nächste Ansaugtakt ausreichend Frischgas aufnehmen kann.",links:["Auslassventile","Abgaskrümmer","Katalysator","Schalldämpfer"]},
waterpump:{title:"Wasserpumpe",tag:"Kühlung",text:"Die Wasserpumpe zirkuliert das Kühlmittel durch Motor und Kühlsystem. Dadurch wird Wärme vom Motor zum Kühler transportiert.",why:"Verbrennung erzeugt sehr viel Wärme. Ein stabiler Kühlmittelkreislauf schützt den Motor vor Überhitzung.",links:["Thermostat","Kühler","Kühlmittelkanäle"]},
};

const steps=[
 {name:"1 · Außen",remove:["valvecover"],unlock:["valvecover","intake","exhaust","waterpump","coils","head","block","oilpan","crank","pistons","rods","cams"],message:"Entferne den Ventildeckel, um den Ventiltrieb freizulegen."},
 {name:"2 · Ventiltrieb",remove:["coils","cams"],unlock:["coils","cams","head"],message:"Nach dem Entfernen der Zündspulen und Nockenwellen liegt der obere Ventiltrieb offen."},
 {name:"3 · Zylinderkopf",remove:["head"],unlock:["block","pistons","rods","crank"],message:"Der Zylinderkopf ist entfernt. Jetzt betrachten wir den Grundmotor und den Kurbeltrieb."},
 {name:"4 · Kurbeltrieb",remove:["block"],unlock:["pistons","rods","crank","oilpan"],message:"Der Block ist ausgeblendet. Kolben, Pleuel und Kurbelwelle sind jetzt als eigene Lernobjekte zugänglich."},
 {name:"5 · Einzelteile",remove:[],unlock:["pistons","rods","crank","oilpan"],message:"Einzelteile des Kurbeltriebs können jetzt nacheinander untersucht werden."}
];
let active=false, current=0;

function render(d, extra=""){
 document.getElementById("panel").innerHTML=`<span class="badge">${d.tag}</span><h2>${d.title}</h2><p>${d.text}</p>${d.why?`<h3>Warum ist das wichtig?</h3><p>${d.why}</p>`:""}${d.links?`<h3>Zusammenhang</h3><ul>${d.links.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${extra}`;
}
function update(){
 document.getElementById("step").textContent=active?steps[current].name:"Übersicht";
 document.getElementById("modeBtn").textContent=active?"🔧 Zerlegung aktiv":"🔧 Zerlegung starten";
 document.getElementById("modeBtn").classList.toggle("active",active);
 document.querySelectorAll(".layer").forEach(el=>{
   el.classList.remove("removed","locked","unlocked");
   if(active){
     const s=steps[current];
     if(s.remove.includes(el.dataset.id)) el.classList.add("removed");
     else if(s.unlock.includes(el.dataset.id)) el.classList.add("unlocked");
     else el.classList.add("locked");
   }
 });
 if(active){
   render({title:steps[current].name,tag:"Zerlegungsmodus",text:steps[current].message,why:"Klicke auf die freigegebenen Bauteile. Mit „Weiter“ gehst du zur nächsten Zerlegungsstufe."});
 }
}
function toggleMode(){active=!active;current=0;update();if(!active)render(parts.overview)}
function nextStep(){if(!active){active=true;current=0}else if(current<steps.length-1)current++;update()}
function prevStep(){if(!active)return;if(current>0)current--;update()}
function resetAll(){active=false;current=0;update();render(parts.overview)}

document.querySelectorAll(".layer").forEach(el=>{
 const act=()=>{render(parts[el.dataset.id]); if(active && steps[current].remove.includes(el.dataset.id)) nextStep()};
 el.addEventListener("click",act);
 el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}});
});
render(parts.overview);
</script>
</body>
</html>
