<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f13">
<title>M50B25 3D Explorer</title>
<style>
:root{--bg:#080c10;--panel:#131920;--line:#2e3941;--text:#edf2f5;--muted:#96a3ac;--accent:#6ec0df}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{min-height:100svh;overflow-x:hidden}button{font:inherit;color:inherit;border:0;cursor:pointer}
header{padding:calc(12px + env(safe-area-inset-top)) 15px 12px;background:#10161b;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}.reset{padding:9px 12px;background:#232c33;border:1px solid #3a474f;border-radius:9px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:calc(100svh - 70px)}
.viewer{position:relative;min-height:650px;overflow:hidden;background:radial-gradient(circle at 50% 43%,#2b343b 0,#151b21 45%,#070a0d 100%);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#canvas{width:100%;height:100%;display:block}
.hud{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.tool{padding:9px 11px;border-radius:9px;background:#1c252cdd;border:1px solid #43505a;font-size:12px;backdrop-filter:blur(8px)}
.tool.active{background:#285264;border-color:#75c3df}
.status{margin-left:auto;padding:9px 11px;background:#0d1217cc;border:1px solid #35414a;border-radius:9px;font-size:12px;color:#b9c4ca}
.help{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;color:#9ba7ae;font-size:11px;background:#090d11bb;padding:7px 10px;border-radius:8px;border:1px solid #273138}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto}.badge{display:inline-block;padding:5px 9px;background:#263943;border:1px solid #3d5864;border-radius:99px;font-size:11px;color:#bce2ef}
.panel h2{font-size:23px;margin:9px 0 7px}.panel p{color:#c7d0d6;line-height:1.55}.panel h3{font-size:11px;color:#8e9ba3;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px}.panel ul{padding-left:19px;line-height:1.65;color:#c7d0d6}.fact{padding:11px 12px;background:#0d1318;border:1px solid #303c44;border-radius:9px;font-size:12px;line-height:1.5}.primary{width:100%;margin-top:13px;padding:12px;background:#2b596b;border:1px solid #70bdd9;border-radius:9px}.secondary{width:100%;margin-top:8px;padding:11px;background:#222b32;border:1px solid #3b474f;border-radius:9px}
@media(max-width:850px){.app{display:block}.viewer{height:64svh;min-height:430px}.panel{border-left:0;border-top:1px solid var(--line);min-height:36svh}}
@media(max-width:600px){.viewer{height:61svh;min-height:400px}.help{font-size:10px}.status{margin-left:0;width:100%;order:10}}
</style>
</head>
<body>
<header>
<div><h1>M50B25 · 3D Explorer</h1><div class="sub">BMW E34 525i · interaktives Lernmodell · iPhone/iPad</div></div>
<button class="reset" onclick="resetView()">↺ Ansicht</button>
</header>
<div class="app">
<section class="viewer" id="viewer">
<div class="hud">
<button class="tool" id="autoBtn" onclick="toggleAuto()">⟳ Auto-Drehung</button>
<button class="tool" onclick="viewFront()">Front</button>
<button class="tool" onclick="viewTop()">Oben</button>
<button class="tool" onclick="viewSide()">Seite</button>
<div class="status" id="status">M50B25 · Außenansicht</div>
</div>
<canvas id="canvas"></canvas>
<div class="help">Finger ziehen = 3D-Motor drehen · zwei Finger = zoomen · Bauteil antippen = auswählen</div>
</section>
<aside class="panel" id="panel"></aside>
</div>
<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),viewer=document.getElementById("viewer");
let W=0,H=0,dpr=1,rx=-.16,ry=-.55,zoom=1,auto=false,drag=false,lastX=0,lastY=0,pinch=0,selected="overview";
const parts={
overview:{tag:"M50B25 · 3D",title:"BMW M50B25",text:"Erste drehbare 3D-Lernansicht des M50B25 im E34. Die Darstellung ist bewusst modular aufgebaut: Zylinderblock, Zylinderkopf, Ventildeckel, Ansaugung, Abgasseite und Nebenaggregate sind getrennte Baugruppen.",why:"Diese Version ist das Fundament für die spätere echte Zerlegung. Jede Baugruppe kann anschließend eine eigene Position, Abhängigkeit und Ausbaubewegung bekommen.",links:["Zylinderblock","Zylinderkopf","Ventildeckel","Ansaugung","Abgaskrümmer","Kurbeltrieb"]},
block:{tag:"Grundmotor",title:"Zylinderblock",text:"Der Block bildet das tragende Zentrum des Reihensechszylinders. Im Inneren sitzen sechs Zylinder, die Kurbelwelle und die Hauptlager.",why:"Der Block wird erst geöffnet bzw. zerlegt, wenn die darüberliegenden Baugruppen entfernt wurden.",links:["6 Zylinder","Kurbelwelle","Hauptlager","Ölversorgung"]},
head:{tag:"Zylinderkopf",title:"Zylinderkopf",text:"Im Kopf befinden sich die Brennräume, Einlass- und Auslasskanäle sowie der Ventiltrieb. Der M50 besitzt zwei obenliegende Nockenwellen.",why:"Erst nach dem Entfernen des Ventildeckels und der erforderlichen Anbauteile wird der Ventiltrieb sichtbar.",links:["Einlassventile","Auslassventile","Nockenwellen","Ventilfedern"]},
valve:{tag:"Abdeckung",title:"Ventildeckel",text:"Der Ventildeckel verschließt den oberen Bereich des Zylinderkopfs und hält das Öl im Ventiltrieb.",why:"Er ist eine der ersten Baugruppen, die bei einer Zerlegung entfernt werden.",links:["Zündspulen","Nockenwellen","Zylinderkopf"]},
intake:{tag:"Ansaugung",title:"Ansaugkrümmer",text:"Der Ansaugkrümmer führt die Luft über sechs Läufe zu den einzelnen Zylindern.",why:"Die sechs Kanäle gehören zum charakteristischen Aufbau des Reihensechszylinders.",links:["Drosselklappe","Einspritzung","Luftführung"]},
exhaust:{tag:"Abgas",title:"Abgaskrümmer",text:"Die Abgaskrümmer sammeln die Verbrennungsgase der sechs Zylinder und führen sie zur Abgasanlage.",why:"Erst wenn die Abgasseite frei zugänglich ist, lässt sich die Baugruppe sinnvoll ausbauen.",links:["Auslassventile","Katalysator","Abgasanlage"]},
water:{tag:"Kühlung",title:"Wasserpumpe",text:"Die Wasserpumpe sorgt für die Zirkulation des Kühlmittels durch Motor und Kühlsystem.",why:"Sie sitzt im vorderen Nebenaggregatetrieb.",links:["Thermostat","Kühlmittel","Riemenantrieb"]},
crank:{tag:"Kurbeltrieb",title:"Kurbelwelle",text:"Die Kurbelwelle wandelt die Hubbewegung der Kolben in Drehbewegung um.",why:"Im nächsten Entwicklungsstadium wird sie erst nach dem Entfernen der darüberliegenden bzw. verbundenen Baugruppen zugänglich.",links:["Pleuel","Kolben","Hauptlager","Ölpumpe"]}
};
function renderPart(id){selected=id;let p=parts[id]||parts.overview;document.getElementById("status").textContent=p.title;document.getElementById("panel").innerHTML=`<span class="badge">${p.tag}</span><h2>${p.title}</h2><p>${p.text}</p><h3>Warum?</h3><p>${p.why}</p><h3>Zusammenhang</h3><ul>${p.links.map(x=>`<li>${x}</li>`).join("")}</ul>${id==="overview"?`<div class="fact"><b>Bedienung</b><br>Ziehe den Motor mit einem Finger. Auf dem iPad/iPhone kannst du mit zwei Fingern hinein- und herauszoomen. Tippe auf eine Baugruppe für Informationen.</div>`:`<button class="primary" onclick="showRemoval('${id}')">🔧 Ausbau vorbereiten</button>`}` }
function showRemoval(id){let p=parts[id];document.getElementById("panel").innerHTML+=`<div class="fact" style="margin-top:10px"><b>Ausbau-Logik</b><br>Diese Baugruppe ist als eigener Teil vorbereitet. Die echte Reihenfolge wird im nächsten Schritt hinterlegt, sodass verborgene Bauteile erst nach dem Ausbau ihrer darüberliegenden Teile zugänglich werden.</div>`}
function resize(){let r=viewer.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener("resize",resize);resize();

function project(x,y,z){let cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);let x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cx-z1*sx,z2=y*sx+z1*cx;let f=900/(900-z2);return [W/2+x1*zoom*f,H/2+y1*zoom*f,z2]}
function poly(points,fill,stroke="#69747a",lw=2){ctx.beginPath();points.forEach((p,i)=>{let q=project(...p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
function box(x,y,z,w,h,d,fill,id){let faces=[
 [[x-w/2,y-h/2,z-d/2],[x+w/2,y-h/2,z-d/2],[x+w/2,y+h/2,z-d/2],[x-w/2,y+h/2,z-d/2]],
 [[x-w/2,y-h/2,z+d/2],[x+w/2,y-h/2,z+d/2],[x+w/2,y+h/2,z+d/2],[x-w/2,y+h/2,z+d/2]],
 [[x-w/2,y-h/2,z-d/2],[x-w/2,y-h/2,z+d/2],[x-w/2,y+h/2,z+d/2],[x-w/2,y+h/2,z-d/2]],
 [[x+w/2,y-h/2,z-d/2],[x+w/2,y-h/2,z+d/2],[x+w/2,y+h/2,z+d/2],[x+w/2,y+h/2,z-d/2]],
 [[x-w/2,y-h/2,z-d/2],[x+w/2,y-h/2,z-d/2],[x+w/2,y-h/2,z+d/2],[x-w/2,y-h/2,z+d/2]],
 [[x-w/2,y+h/2,z-d/2],[x+w/2,y+h/2,z-d/2],[x+w/2,y+h/2,z+d/2],[x-w/2,y+h/2,z+d/2]]
];let ps=faces.map(f=>({f,avg:f.reduce((a,p)=>a+project(...p)[2],0)/4})).sort((a,b)=>a.avg-b.avg);ps.forEach((o,i)=>poly(o.f,fill, i===5?"#aab2b6":"#4d585f",2))}
function ellipse(x,y,z,rx0,ry0,fill,stroke="#657077"){let pts=[];for(let i=0;i<40;i++){let a=i*Math.PI*2/40;pts.push([x+Math.cos(a)*rx0,y+Math.sin(a)*ry0,z])}poly(pts,fill,stroke,2)}
function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#0c1115";ctx.fillRect(0,0,W,H);

function roundedBox3D(x,y,z,w,h,d,fill,id,edge="#737d82"){
  box(x,y,z,w,h,d,fill,id);
}
function cylX(x,y,z,len,r,fill,edge="#7c868b"){
  let a=project(x-len/2,y,z),b=project(x+len/2,y,z);
  ctx.save();ctx.strokeStyle=fill;ctx.lineWidth=r*zoom*.85;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore();
}
function circle3(x,y,z,r,fill,edge="#7d888e"){
  let p=project(x,y,z);let rr=r*zoom;
  ctx.beginPath();ctx.arc(p[0],p[1],rr,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
}
function line3(points,color,width=5){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();
  points.forEach((p,i)=>{let q=project(...p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke();ctx.restore();
}

/* E34/M50B25 longitudinal layout:
   intake/airbox on left in this view, exhaust manifolds on right,
   accessory drive at front, long inline-six block and sump. */
roundedBox3D(0,62,0,555,230,178,"#515b60","block","#8f999e");

/* block casting ribs + six bores */
for(let i=-2.5;i<=2.5;i++){
  let x=i*77;
  circle3(x,-2,-92,31,"#242b2f","#a9b1b4");
  circle3(x,-2,-94,21,"#12171a","#59646a");
  line3([[x-31,35,-92],[x-31,115,-92]],"#777f84",4);
  line3([[x+31,35,-92],[x+31,115,-92]],"#777f84",4);
}
/* lower crankcase web */
roundedBox3D(0,145,0,530,105,175,"#394247","crankcase","#707b81");
/* E34 sump: deeper rearward section */
roundedBox3D(0,205,0,515,82,182,"#20282d","oilpan","#707a80");
roundedBox3D(105,224,0,205,48,150,"#171d21","oilpan2","#4d585e");

/* cylinder head with six combustion chambers */
roundedBox3D(0,-112,0,565,92,190,"#929b9f","head","#c0c6c9");
for(let i=-2.5;i<=2.5;i++){
  let x=i*77;
  circle3(x,-112,-99,25,"#3d454a","#c2c7ca");
  circle3(x,-112,-101,17,"#1b2125","#717b80");
}
/* head casting channels */
line3([[-265,-80,-100],[-180,-80,-100],[-95,-80,-100],[-10,-80,-100],[75,-80,-100],[160,-80,-100],[265,-80,-100]],"#555f64",8);

/* black M50 valve cover with ribbed upper surface */
roundedBox3D(0,-181,0,535,76,166,"#1e2529","valve","#7f898e");
for(let i=-4;i<=4;i++)line3([[i*45,-207,-86],[i*45,-155,-86]],"#4e595f",5);
let bp=project(0,-183,-87);
ctx.save();ctx.font="bold 18px system-ui";ctx.fillStyle="#cbd0d2";ctx.textAlign="center";ctx.fillText("BMW",bp[0],bp[1]);ctx.restore();
/* oil filler cap on valve cover */
circle3(165,-184,-95,25,"#2b3338","#969fa4");circle3(165,-184,-98,14,"#171c20","#59646a");

/* six individual ignition coil housings */
for(let i=-2.5;i<=2.5;i++){
  roundedBox3D(i*77,-165,-96,43,62,26,"#11161a","coils","#606b71");
  circle3(i*77,-140,-112,8,"#657077","#aeb5b8");
}

/* intake manifold: six runners, large black plenum and throttle body */
roundedBox3D(-300,15,0,185,90,215,"#20282d","intake","#68737a");
for(let i=-2.5;i<=2.5;i++){
  let x=i*45-305;
  cylX(x,10,-113,125,20,"#303a3f","#737d82");
  line3([[x-58,10,-113],[x+58,10,-113]],"#101519",9);
}
roundedBox3D(-390,5,0,92,85,230,"#252e33","intake","#707a80");
/* throttle */
circle3(-445,15,0,42,"#8c9599","#c2c8ca");circle3(-445,15,-4,24,"#252c31","#687279");
line3([[-468,15,-4],[-422,15,-4]],"#b9c0c3",6);

/* E34 airbox and intake elbow */
roundedBox3D(-475,125,0,125,160,165,"#181e22","airbox","#59646a");
line3([[-530,70,0],[-475,100,0],[-440,135,0]],"#30383d",24);
circle3(-518,90,-90,18,"#0d1215","#687279");

/* exhaust: distinct front and rear 3-into-1 manifold groups */
function exhaustBranch(x0,y0,z0,side){
  for(let j=0;j<3;j++){
    let yy=y0+(j-1)*34;
    line3([[x0,yy,side*108],[x0+45,yy+10,side*118],[x0+95,yy+25,side*122],[x0+140,yy+35,side*125]],"#8b9295",18);
  }
  line3([[x0+135,y0-25,side*125],[x0+205,y0,side*125],[x0+250,y0+25,side*125]],"#666f74",23);
}
exhaustBranch(270,-25,0,1);exhaustBranch(270,60,0,1);

/* front accessory drive: water pump, alternator, tensioner, crank pulley */
circle3(300,128,108,63,"#5e686d","#b9c0c3");
circle3(300,128,111,18,"#222a2e","#8d979c");
circle3(375,155,112,47,"#737c81","#bcc2c5");
circle3(375,155,115,15,"#242b2f","#8d969b");
circle3(220,180,115,31,"#555f64","#9ba4a8");
/* serpentine belt loop */
let beltPts=[];
for(let i=0;i<=60;i++){let a=i*Math.PI*2/60;beltPts.push([330+105*Math.cos(a),145+85*Math.sin(a),125])}
line3(beltPts,"#111518",15);

/* visible E34 front coolant outlet / thermostat housing */
roundedBox3D(420,35,110,85,75,75,"#737d81","water","#aab2b6");
circle3(420,35,151,22,"#333b40","#b2b9bc");

/* crank pulley and harmonic mass at lower front */
circle3(250,215,128,72,"#343c41","#b5bcc0");
circle3(250,215,132,51,"#151a1e","#7f898e");
circle3(250,215,136,18,"#6d777c","#c0c6c8");

/* starter area */
roundedBox3D(-235,115,105,105,75,80,"#252d32","starter","#68737a");

/* crankshaft hint through lower block */
line3([[-210,130,-110],[-120,160,-110],[-30,140,-110],[60,165,-110],[150,140,-110],[235,160,-110]],"#c7cdcf",8);
for(let i=-2.5;i<=2.5;i++)circle3(i*77,145,-112,9,"#d1d5d7","#5f696f");

/* labels only when selected */
if(selected!=="overview"){
  let p=parts[selected], lp=project(0,-275,0);
  ctx.save();ctx.font="600 13px system-ui";ctx.fillStyle="#dce5e9";ctx.textAlign="center";
  ctx.fillText(p.title,lp[0],lp[1]);ctx.restore();
}
 requestAnimationFrame(draw);
}
function setView(a,b,z=1){rx=a;ry=b;zoom=z}
function resetView(){setView(-.16,-.55,1);renderPart("overview")}
function viewFront(){setView(-.05,0,1.05)}function viewTop(){setView(-1.15,0,1)}function viewSide(){setView(-.05,1.55,1.05)}
function toggleAuto(){auto=!auto;document.getElementById("autoBtn").classList.toggle("active",auto)}
let lastT=performance.now();function tick(t){let dt=(t-lastT)/1000;lastT=t;if(auto)ry+=dt*.35;requestAnimationFrame(tick)}requestAnimationFrame(tick);

function pointerDown(e){drag=true;lastX=e.clientX;lastY=e.clientY}
function pointerMove(e){if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;ry+=dx*.008;rx+=dy*.006;rx=Math.max(-1.45,Math.min(1.45,rx));lastX=e.clientX;lastY=e.clientY}
function pointerUp(){drag=false}
viewer.addEventListener("pointerdown",e=>{e.preventDefault(); viewer.setPointerCapture?.(e.pointerId); pointerDown(e);});viewer.addEventListener("pointermove",e=>{e.preventDefault(); pointerMove(e);});viewer.addEventListener("pointerup",e=>{drag=false; try{viewer.releasePointerCapture?.(e.pointerId)}catch(_){};});viewer.addEventListener("pointercancel",pointerUp);
viewer.addEventListener("wheel",e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);zoom=Math.max(.55,Math.min(1.8,zoom))},{passive:false});
let touchDist=0;viewer.addEventListener("touchstart",e=>{if(e.touches.length===2){touchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:false});
viewer.addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom*=d/touchDist;zoom=Math.max(.55,Math.min(1.8,zoom));touchDist=d}},{passive:false});

canvas.addEventListener("click",e=>{
 let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 let targets=[
  ["valve",0,-181,250,42],
  ["head",0,-112,275,48],
  ["block",0,62,275,115],
  ["intake",-300,15,95,75],
  ["exhaust",350,45,105,125],
  ["water",300,128,85,85],
  ["crank",250,215,90,75]
 ];
 for(const [id,xx,yy,ww,hh] of targets){
   let p=project(xx,yy,0);
   if(Math.abs(x-p[0])<ww*zoom&&Math.abs(y-p[1])<hh*zoom){renderPart(id);return}
 }
});
draw();renderPart("overview");
</script>
</body>
</html>
